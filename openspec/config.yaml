schema: spec-driven

context: |
  Branching convention:
  Always work on a dedicated feature branch (`feat/<change-name>` or `fix/<change-name>`).
  Never make implementation changes directly on `main` or `master`.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - Always ensure you are on a dedicated feature branch (`feat/<change-name>`) before writing code or running implementation tasks. Never work directly on `main` or `master`.

